name: Bump chimera-tas

# Once a week: move chimera-tas/ to Chimera's newest nightly, check that it
# builds, publish it to the AUR, and commit the bump here.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:      # Actions tab > Bump chimera-tas > Run workflow

permissions:
  contents: write

concurrency:
  group: bump-chimera-tas
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update to the newest nightly
        id: bump
        working-directory: chimera-tas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh api repos/ToolAssisted-run/chimera/releases/latest -q .tag_name)
          case "$tag" in
            nightly-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::unexpected latest release tag: $tag"; exit 1 ;;
          esac
          current=$(sed -n 's/^_tag=//p' PKGBUILD)
          if [ "$tag" = "$current" ]; then
            echo "Already at $tag"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ver=$(echo "${tag#nightly-}" | tr -d -)
          echo "Bumping $current -> $tag ($ver)"
          sed -i "s/^_tag=.*/_tag=$tag/; s/^pkgver=.*/pkgver=$ver/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # the AUR's .SRCINFO is regenerated by the deploy action; keep this
          # repository's copy in step with it
          sed -i "s/^\tpkgver = .*/\tpkgver = $ver/; s/^\tpkgrel = .*/\tpkgrel = 1/; s/#tag=nightly-[0-9-]*/#tag=$tag/" .SRCINFO
          {
            echo "changed=true"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish to the AUR
        if: steps.bump.outputs.changed == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: chimera-tas
          pkgbuild: ./chimera-tas/PKGBUILD
          assets: |
            ./chimera-tas/chimera-tas.sh
            ./chimera-tas/chimera-tas.desktop
            ./chimera-tas/chimera-tas.install
          # build it first, installing its dependencies: a nightly that does
          # not build is not published
          test: true
          test_flags: --clean --cleanbuild --syncdeps --noconfirm
          commit_username: PASRC
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ steps.bump.outputs.tag }}

      - name: Commit the bump here
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chimera-tas: update to ${{ steps.bump.outputs.tag }}" -- chimera-tas/PKGBUILD chimera-tas/.SRCINFO
          git push
